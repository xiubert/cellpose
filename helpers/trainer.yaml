# Cellpose-SAM fine-tune hyperparameters — single source of truth for a
# SLURM training run. Read by trainer_slurm.py.
#
# Override the path with CELLPOSE_TRAIN_CONFIG (run_trainer.slurm sets it to
# $HOME/cellpose/trainer.yaml by default). The job freezes a copy of the
# resolved values into the run log, and run_trainer.slurm also copies this
# file to run_logs/cellpose_train_<jobid>.config.yaml.
#
# Anything omitted falls back to the built-in defaults in trainer_slurm.py.
# Unknown keys are warned about and ignored (typo guard).

# Dataset for the run. Consumed by run_trainer.slurm (the bash side, which
# stages data to node-local scratch before training); trainer_slurm.py itself
# reads the scratch dirs via env vars. `source` must contain train/ and test/
# subdirs of paired .tif + _seg.npy. Overridable with CELLPOSE_DATA_SRC.
# `model_dst` (optional) is where trained models are copied back to.
data:
  source:    /ix1/pcody/cellpose/data/PMID_38653806/Cunningham
  model_dst: /ix1/pcody/cellpose/models

train:
  weight_decay:   0.1
  learning_rate:  1.0e-5
  n_epochs:       95
  batch_size:     8         # was 1 on local 8 GB GPU; 8 fits an A100 40 GB
  nimg_per_epoch: 750       # match the old offline-aug crop budget (93×8≈744);
                            # default (=#train files=93) gave 8× fewer steps/epoch
  model_name:     label_xfer_online_aug_nimg750  # budget-matched online-aug rerun

# Refining an already-adapted model on a small target dataset:
#   weight_decay:  0.05    # or 0.1 if overfitting appears
#   learning_rate: 1.0e-6
#   n_epochs:      40
#   batch_size:    8

# Online image-only augmentation (helpers/aug_online.py). Applied to each
# augmented TRAIN crop after cellpose's built-in geometry (continuous rotate /
# flip / scale / crop) and before the forward pass — labels are never touched,
# nothing is written to disk. Omit a section (or the whole block) to disable it.
# This replaces the photometric/D4 use of the offline augment.py for training:
# geometry is already done on the fly, so only photometric + occlusion are added.
augment:
  seed: 0
  intensity:   {p: 0.5, scale: [0.75, 1.25], gamma: [0.8, 1.25]}
  cutout:      {p: 0.5, n: [1, 3], size_frac: [0.05, 0.15], fill: mean}
  gauss_noise: {p: 0.3, sigma_frac: 0.05}
  gauss_blur:  {p: 0.2, sigma: [0.5, 1.5]}
