# Warm-start REFINE config — init from an already-adapted model
# (label_xfer_aug_retest) and gently refine on the small CLC target set, rather
# than training from stock cpsam. Used by the LOAO CV via:
#   CELLPOSE_TRAIN_CONFIG=$HOME/cellpose/trainer_warmstart.yaml \
#   ./submit_cv.sh clc_all /ix1/pcody/cellpose/models/label_xfer_aug_retest
#
# run_clc_cv.slurm overrides data dirs (CELLPOSE_TRAIN_DIR), model_name
# (CELLPOSE_MODEL_NAME) and the init weights (CELLPOSE_PRETRAINED=INIT) per fold.
#
# Lower LR + fewer epochs than the from-cpsam regime: the model is already
# adapted, so we nudge it toward CLC without erasing what it learned. augment:
# is held IDENTICAL to the from-cpsam run (trainer.yaml) so the only difference
# vs Result-4 is {init + refine regime} — that package IS the "warm-start"
# hypothesis (note: init and lr/epochs move together by design).

data:
  source:    /ix1/pcody/cellpose/data/CLC      # ignored under CV (dirs come from CELLPOSE_TRAIN_DIR)
  model_dst: /ix1/pcody/cellpose/models

train:
  weight_decay:   0.05      # 0.1 if overfit appears
  learning_rate:  1.0e-6    # 10x lower than from-cpsam (1e-5)
  n_epochs:       40        # refine, not full train
  batch_size:     8
  nimg_per_epoch: 750       # same crop budget as Result-4
  model_name:     clc_all_warm   # overridden per fold by CELLPOSE_MODEL_NAME

augment:
  seed: 0
  intensity:   {p: 0.5, scale: [0.75, 1.25], gamma: [0.8, 1.25]}
  cutout:      {p: 0.5, n: [1, 3], size_frac: [0.05, 0.15], fill: mean}
  gauss_noise: {p: 0.3, sigma_frac: 0.05}
  gauss_blur:  {p: 0.2, sigma: [0.5, 1.5]}
